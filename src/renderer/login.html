<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management - Login</title>
    <link rel="stylesheet" href="styles/auth.css">
    <link href="../../assets/css/font-awesome.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <i class="fas fa-users"></i>
                    <h1>Customer CRM</h1>
                </div>
                <p class="auth-subtitle">Welcome back! Please sign in to your account.</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active">
                <div class="form-group">
                    <label for="login-username">
                        <i class="fas fa-user"></i>
                        Username
                    </label>
                    <input type="text" id="login-username" name="username" required placeholder="Enter your username">
                </div>
                
                <div class="form-group">
                    <label for="login-password">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>
                    <div class="password-input">
                        <input type="password" id="login-password" name="password" required placeholder="Enter your password">
                        <button type="button" class="password-toggle" onclick="togglePassword('login-password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In
                </button>

                <div class="auth-switch">
                    <p>Don't have an account? <a href="#" onclick="showSignupForm()">Sign up here</a></p>
                </div>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" class="auth-form">
                <div class="form-group">
                    <label for="signup-fullname">
                        <i class="fas fa-user-circle"></i>
                        Full Name
                    </label>
                    <input type="text" id="signup-fullname" name="fullName" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="signup-username">
                        <i class="fas fa-user"></i>
                        Username
                    </label>
                    <input type="text" id="signup-username" name="username" required placeholder="Choose a username">
                    <div class="field-hint">
                        <i class="fas fa-info-circle"></i>
                        3-20 characters, letters, numbers, and underscores only
                    </div>
                </div>


                
                <div class="form-group">
                    <label for="signup-password">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>
                    <div class="password-input">
                        <input type="password" id="signup-password" name="password" required placeholder="Create a password" minlength="6">
                        <button type="button" class="password-toggle" onclick="togglePassword('signup-password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="field-hint">
                        <i class="fas fa-info-circle"></i>
                        Minimum 6 characters required
                    </div>
                </div>

                <div class="form-group">
                    <label for="signup-confirm-password">
                        <i class="fas fa-lock"></i>
                        Confirm Password
                    </label>
                    <div class="password-input">
                        <input type="password" id="signup-confirm-password" name="confirmPassword" required placeholder="Confirm your password" minlength="6">
                        <button type="button" class="password-toggle" onclick="togglePassword('signup-confirm-password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-success btn-full">
                    <i class="fas fa-user-plus"></i>
                    Create Account
                </button>

                <div class="auth-switch">
                    <p>Already have an account? <a href="#" onclick="showLoginForm()">Sign in here</a></p>
                </div>
            </form>


        </div>

        <!-- Loading Overlay -->
        <div id="auth-loading" class="loading-overlay">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Please wait...</p>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div id="toast-container" class="toast-container"></div>
    </div>

    <script src="scripts/auth.js"></script>
</body>
</html>
